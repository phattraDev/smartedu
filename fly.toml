# fly.toml app configuration file generated for smartedu on 2026-05-23T04:03:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'smartedu'
primary_region = 'sin'

[build]

[env]
  RUN_BOT = 'true'
  UPLOAD_DIR = '/app/uploads'

[[mounts]]
  source = 'school_data'
  destination = '/app/uploads'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
